name: Bug Report
description: Report a problem with Flow
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
      placeholder: "When I do X, Y happens instead of Z"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Start Flow with `uvicorn flow_app.main:app`
        2. Create a task via the board UI
        3. ...
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste any relevant console output or stack traces
      render: shell

  - type: input
    id: version
    attributes:
      label: Flow version
      description: Git commit, tag, or release version
      placeholder: "e.g. v0.1.0 or commit abc1234"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - uvicorn (local)
        - Docker Compose
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant env vars or config (redact secrets!)
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, browser info, or anything else